name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest -q

  benchmark:
    # Reproduces the lexical rows of the README results table on every push.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e .
      - run: python -m scour.eval.cranfield --out data/cranfield
      - run: python -m scour.eval.run --data data/cranfield
      - run: python -m scour.eval.run --data data/cranfield --text-only

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t scour .
      - run: |
          docker run -d -p 8000:8000 --name scour scour
          for i in $(seq 1 30); do curl -fs "localhost:8000/search?q=boundary+layer" && exit 0; sleep 1; done
          docker logs scour; exit 1
